name: CD - Build, Security Scan & Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_ID: kalaa-connect-prod
  REGION: europe-west1
  GAR_LOCATION: europe-west1
  REPOSITORY: kalaa-connect-registry
  IMAGE_NAME: kalaa-api

jobs:
  # 1. Tests & Analyse de vulnérabilités Trivy
  security-and-test:
    name: Tests & Scan de sécurité Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation et tests
        run: |
          npm ci
          npm run test

      - name: Build de l'image Docker locale pour audit
        run: |
          docker build -t kalaa-api:local -f apps/api/Dockerfile .

      - name: Scan de vulnérabilités Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'kalaa-api:local'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # 2. Déploiement du Frontend sur Cloudflare Pages
  deploy-frontend:
    name: Déploiement Web sur Cloudflare Pages
    needs: security-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build du Frontend Vite
        run: |
          npm ci
          npm run build --workspace=packages/shared
          npm run build --workspace=apps/web

      - name: Déploiement sur Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'kalaa-connect'
          directory: 'apps/web/dist'

  # 3. Déploiement de l'API sur Google Cloud Run
  deploy-api-cloud-run:
    name: Déploiement API sur Cloud Run
    needs: security-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v2
        if: env.GCP_SA_KEY != ''
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configuration Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        if: env.GCP_SA_KEY != ''

      - name: Build & Push Docker vers Google Artifact Registry
        if: env.GCP_SA_KEY != ''
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -f apps/api/Dockerfile .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Déploiement Cloud Run
        if: env.GCP_SA_KEY != ''
        run: |
          gcloud run deploy kalaa-connect-api \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --max-instances 2 \
            --allow-unauthenticated
