name: CI/CD Pipeline - Quality, Security & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    name: Code Quality & Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify Lockfile & Install Dependencies
        run: npm ci

      - name: Build Shared Library
        run: npm run build --workspace=packages/shared

      - name: Linting & Code Standards
        run: npm run lint --workspaces --if-present

  unit-and-integration-tests:
    name: Unit & Integration Tests (Jest & Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Library
        run: npm run build --workspace=packages/shared

      - name: Run Backend Unit Tests (NestJS / Jest)
        run: npm run test:api

      - name: Run Frontend Component Tests (React / Vitest)
        run: npm run test:web

  security-scans:
    name: Security Scans (SAST & Vulnerability Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high || true

      - name: Gitleaks Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  build-verification:
    name: Production Build Verification
    needs: [code-quality, unit-and-integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Library
        run: npm run build --workspace=packages/shared

      - name: Build API Application
        run: npm run build --workspace=apps/api

      - name: Build Web PWA Application
        run: npm run build --workspace=apps/web

      - name: Verify Production Artifacts
        run: |
          test -d apps/api/dist && echo "API build OK"
          test -d apps/web/dist && echo "Web PWA build OK"
