name: CI - Lint, Test & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validation & Tests Automatisés
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Linting du code
        run: npm run lint

      - name: Exécution des tests unitaires et intégration
        run: npm run test

      - name: Compilation des applications
        run: npm run build
