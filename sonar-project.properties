# ====================================================================
# Kalaa Connect — SonarQube / SonarCloud Code Quality Configuration
# Option Cloud & DevSecOps — Stage 2ème Année ESPRIT (Nada SLAMA)
# ====================================================================

sonar.projectKey=kalaa-connect
sonar.projectName=Kalaa Connect - Smart City Platform
sonar.projectVersion=1.0.0

# Sources à analyser
sonar.sources=apps/api/src,apps/web/src,packages/shared/src
sonar.tests=apps/api/src,apps/web/src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# Exclusions d'analyse
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/data/**

# Spécification TypeScript / JavaScript
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.base.json

# Seuils de qualité et règles
sonar.qualitygate.wait=true
sonar.cpd.exclusions=**/*.dto.ts,**/*.spec.ts
