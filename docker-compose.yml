version: '3.8'

services:
  # Base de données PostgreSQL locale (alternative locale à Supabase)
  postgres:
    image: postgres:15-alpine
    container_name: kalaa-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kalaa_connect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/src/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API NestJS
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kalaa-api
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_MODE: mock
      EMAIL_PROVIDER: mock
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  # Application Web React PWA
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: kalaa-web
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api

  # Monitoring Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: kalaa-prometheus
    restart: always
    volumes:
      - ./supervision/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./supervision/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml
    ports:
      - "9090:9090"
    depends_on:
      - api

  # Monitoring Dashboards Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: kalaa-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./supervision/grafana-dashboard.json:/var/lib/grafana/dashboards/kalaa-dashboard.json
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # Serveur de capture d'emails local (Inbucket)
  maildev:
    image: inbucket/inbucket:latest
    container_name: kalaa-inbucket
    ports:
      - "9000:9000"
      - "2500:2500"

volumes:
  pgdata:
